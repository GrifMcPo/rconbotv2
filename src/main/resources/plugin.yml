name: TelegramConsoleBot
version: 2.0
main: com.grifmcpo.consolebot.TelegramConsoleBot
api-version: 1.13
depend: [Vault, LuckPerms]
author: GrifMcPo
description: Telegram bot for server management

commands:
  ban:
    description: Ban a player
    permission: telegramconsolebot.ban
    usage: /ban <player> [time] <reason> [-s]
  banuuid:
    description: Ban by UUID
    permission: telegramconsolebot.ban
    usage: /banuuid <uuid> [time] <reason> [-s]
  mute:
    description: Mute a player
    permission: telegramconsolebot.mute
    usage: /mute <player> [time] <reason> [-s]
  kick:
    description: Kick a player
    permission: telegramconsolebot.kick
    usage: /kick <player> <reason> [-s]
  warn:
    description: Warn a player
    permission: telegramconsolebot.warn
    usage: /warn <player> <reason> [-s]
  unwarn:
    description: Remove warning from a player
    permission: telegramconsolebot.warn
    usage: /unwarn <player> <reason>
  bc:
    description: Broadcast a message
    permission: telegramconsolebot.bc
    usage: /bc <message>
  logs:
    description: View player command logs
    permission: telegramconsolebot.logs
    usage: /logs <player> [amount]
  dupeip:
    description: Find players with same IP
    permission: telegramconsolebot.dupeip
    usage: /dupeip <player>
  seen:
    description: Check if player is online
    permission: telegramconsolebot.seen
    usage: /seen <player>
  pex:
    description: Check player info or group list
    permission: telegramconsolebot.pex
    usage: /pex user <player> | /pex group
  msg:
    description: Send private message
    permission: telegramconsolebot.msg
    usage: /msg <player> <message>
  tell:
    description: Send private message
    permission: telegramconsolebot.msg
    usage: /tell <player> <message>
  t:
    description: Send private message
    permission: telegramconsolebot.msg
    usage: /t <player> <message>
  r:
    description: Reply to last message
    permission: telegramconsolebot.msg
    usage: /r <message>
  reply:
    description: Reply to last message
    permission: telegramconsolebot.msg
    usage: /reply <message>
  togglemsg:
    description: Toggle private messages
    permission: telegramconsolebot.msg
    usage: /togglemsg
  msgtoggle:
    description: Toggle private messages
    permission: telegramconsolebot.msg
    usage: /msgtoggle
  report:
    description: Report a player
    permission: telegramconsolebot.report
    usage: /report <player> <reason>

permissions:
  telegramconsolebot.admin:
    description: All admin permissions
    default: op
    children:
      telegramconsolebot.ban: true
      telegramconsolebot.mute: true
      telegramconsolebot.kick: true
      telegramconsolebot.warn: true
      telegramconsolebot.bc: true
      telegramconsolebot.logs: true
      telegramconsolebot.dupeip: true
      telegramconsolebot.seen: true
      telegramconsolebot.pex: true
      telegramconsolebot.msg: true
      telegramconsolebot.report: true
  
  telegramconsolebot.ban:
    description: Ban permission
    default: op
  telegramconsolebot.mute:
    description: Mute permission
    default: op
  telegramconsolebot.kick:
    description: Kick permission
    default: op
  telegramconsolebot.warn:
    description: Warn permission
    default: op
  telegramconsolebot.bc:
    description: Broadcast permission
    default: op
  telegramconsolebot.logs:
    description: View logs
    default: op
  telegramconsolebot.dupeip:
    description: Dupe IP check
    default: op
  telegramconsolebot.seen:
    description: Seen command
    default: op
  telegramconsolebot.pex:
    description: PEX command
    default: op
  telegramconsolebot.msg:
    description: Private messages
    default: true
  telegramconsolebot.report:
    description: Report permission
    default: true
